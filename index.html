<!DOCTYPE html>
<html lang="it">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="imgs/favicon.ico" type="image/x-icon">
    <title>Link Tree Momiq_</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div id="container-link-tree">
        <div id="header-link-tree">
            <figure>
                <img src="imgs/mimo.jpg" id="mimo-img" class="animate">
                <figcaption><h1><strong>Momiq_</strong></h1></figcaption>
            </figure>
        </div>
        <div id="main-link-tree">
            <img src="imgs/cat-1.png" class="cats" id="cat-left">
            <div id="container-link">
                <button onclick="linkPage('https://www.twitch.tv/momiq_')">
                    <img src="imgs/socials/twitch-logo.png" class="img-icon"><p>Twitch</p>
                </button>

                <button onclick="linkPage('https://www.youtube.com/@Momiq04')">
                    <img src="imgs/socials/youtube-logo.webp" class="img-icon"><p>Youtube</p>
                </button>

                <button onclick="linkPage('https://www.instagram.com/ilmomiq_')">
                    <img src="imgs/socials/ig-logo.png" class="img-icon"><p>Instagram</p>
                </button>

                <button onclick="linkPage('https://discord.gg/wJsUfJyxNJ')">
                    <img src="imgs/socials/discord-logo.png" class="img-icon"><p>Discord</p>
                </button>
            </div>
            <img src="imgs/cat-2.png" class="cats" id="cat-right">
        </div>
    </div>
</body>

</html>
