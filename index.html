<!DOCTYPE html>
<html lang="it">
    
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="/imgs/icon-site.png">
    <title>Link Tree Momiq_</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container-all">
        <header>
            <figure>
                <img src="/imgs/mimo.jpg" id="mimo-img" class="animate">
                <figcaption><h1><strong>Momiq_</strong></h1></figcaption>
            </figure>
        </header>
        <hr>
        <main>
            <figure>
                <img src="/imgs/cat-2.png" class="cats cat-left">
            </figure>
            <div id="container-link">
                <section>
                    <a href="https://www.twitch.tv/momiq_" target="_blank">
                        <div class="container-socialmedia">
                            <img src="/imgs/twitch-logo.png" class="img-icon"><p>Twitch</p>
                        </div>
                    </a>
                </section>
                <section>
                    <a href="https://www.youtube.com/@Momiq04" target="_blank">
                        <div class="container-socialmedia">
                            <img src="/imgs/youtube-logo-youtube-icon-transparent-free-png.webp" class="img-icon"><p>Youtube</p>
                        </div>
                    </a>
                </section>
                <section>
                    <a href="https://www.instagram.com/ilmomiq_" target="_blank">
                        <div class="container-socialmedia">
                            <img src="/imgs/ig-logo.png" class="img-icon"><p>Instagram</p>
                        </div>
                    </a>
                </section>
                <section>
                    <a href="https://discord.gg/wJsUfJyxNJ" target="_blank">
                        <div class="container-socialmedia">
                            <img src="/imgs/ds-logo.png" class="img-icon"><p>Discord</p>
                        </div>
                    </a>
                </section>
            </div>
            <figure class="container-cats-figure">
                <img src="/imgs/cat-2.png" class="cats cat-right">
            </figure>
        </main>
    </div>
</body>

</html>
